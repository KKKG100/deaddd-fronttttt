# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dead-front
    runtime: node
    plan: starter        # "free" works for a few friends, but its tiny CPU + auto-sleep hurts big hordes
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MAX_PLAYERS
        value: "24"
      - key: MAX_ZOMBIES
        value: "1500"
